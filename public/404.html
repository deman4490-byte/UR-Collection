<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>UR Collection</title>
    <script type="text/javascript">
      // GitHub Pages Single Page Apps (SPA) 404 Redirector
      // Automatically redirects any direct non-hash URLs to HashRouter format (/#/route)
      // preventing GitHub Pages 404 errors when manually navigating or refreshing.
      var l = window.location;
      var pathSegmentsToKeep = (l.hostname.endsWith('github.io') && l.pathname.split('/').filter(Boolean).length > 0) ? 1 : 0;

      var baseRepoPath = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var routePath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');

      var target = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        baseRepoPath + '/#/' + routePath +
        (l.search ? '?' + l.search.slice(1) : '') +
        l.hash;

      l.replace(target);
    </script>
  </head>
  <body>
  </body>
</html>
